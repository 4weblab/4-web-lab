<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Responsive preload of the LCP hero image. The browser picks the best variant
         based on imagesizes. Falls back to href on Firefox (no imagesrcset support). -->
    <link
      rel="preload"
      as="image"
      href="/hero/hero-bg-desktop.webp"
      imagesrcset="/hero/hero-bg-mobile.webp 800w, /hero/hero-bg-tablet.webp 1280w, /hero/hero-bg-desktop.webp 1920w"
      imagesizes="100vw"
      type="image/webp"
      fetchpriority="high"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload Playfair Display 700 (used by the hero H1) to avoid FOUT on LCP -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://fonts.gstatic.com/s/playfairdisplay/v37/nuFvD-vYSZviVYUb_rj3ij__anPXJzDwcbmjWBN2PKdFvXDXbtY.woff2"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" /></noscript>

    <title>Agenzia Web Padova | Siti Professionali per Negozi, Professionisti e Aziende | Soluzioni web per la tua impresa | 4 Web Lab</title>
    <meta
      name="description"
      content="Agenzia Web Padova specializzata in siti professionali per negozi, professionisti e PMI. Pacchetti da 199€ tutto incluso. Siti veloci, ottimizzati SEO e con assistenza locale. Preventivo gratuito in 24 ore!"
    />
    <meta name="author" content="4 Web Lab" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://4weblab.it/" />
    <meta
      property="og:title"
      content="Agenzia Web Padova | Siti Professionali per Negozi, Professionisti e Aziende | Soluzioni web per la tua impresa | 4 Web Lab"
    />
    <meta
      property="og:description"
      content="Agenzia Web Padova specializzata in siti professionali per negozi, professionisti e PMI. Pacchetti da 199€ tutto incluso. Siti veloci, ottimizzati SEO e con assistenza locale. Preventivo gratuito in 24 ore!"
    />
    <meta property="og:image" content="https://4weblab.it/og-image.jpg" />
    <meta property="og:locale" content="it_IT" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://4weblab.it/" />
    <meta
      name="twitter:title"
      content="Agenzia Web Padova | Siti Professionali per Negozi, Professionisti e Aziende | Soluzioni web per la tua impresa | 4 Web Lab"
    />
    <meta
      name="twitter:description"
      content="Agenzia Web Padova specializzata in siti professionali per negozi, professionisti e PMI. Pacchetti da 199€ tutto incluso. Siti veloci, ottimizzati SEO e con assistenza locale. Preventivo gratuito in 24 ore!"
    />
    <meta name="twitter:image" content="https://4weblab.it/og-image.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
