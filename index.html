<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Responsive preload of the LCP hero image. The browser picks the best variant
         based on imagesizes. Falls back to href on Firefox (no imagesrcset support). -->
    <link
      rel="preload"
      as="image"
      href="/hero/hero-bg-desktop.webp"
      imagesrcset="/hero/hero-bg-mobile.webp 800w, /hero/hero-bg-tablet.webp 1280w, /hero/hero-bg-desktop.webp 1920w"
      imagesizes="100vw"
      type="image/webp"
      fetchpriority="high"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload Playfair Display 700 (used by the hero H1) to avoid FOUT on LCP -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://fonts.gstatic.com/s/playfairdisplay/v37/nuFvD-vYSZviVYUb_rj3ij__anPXJzDwcbmjWBN2PKdFvXDXbtY.woff2"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" /></noscript>

    <!-- AEO/GEO: allow full snippets and large image previews for AI Overviews & answer engines -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Sitewide JSON-LD: LocalBusiness + InternetMarketingService (aligned with GBP category) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "additionalType": "https://schema.org/InternetMarketingService",
      "@id": "https://4weblab.it/#business",
      "name": "4 Web Lab di Fullin Carlo",
      "url": "https://4weblab.it",
      "logo": "https://4weblab.it/logo.webp",
      "image": "https://4weblab.it/og-image.webp",
      "description": "4 Web Lab è un servizio di marketing su Internet con sede a Legnaro (Padova): realizzazione siti web professionali, SEO avanzata, Google Ads e ottimizzazione per Google e le AI.",
      "slogan": "Siti web, SEO e AI per chi vuole essere trovato davvero.",
      "telephone": "+39 351 465 6042",
      "email": "info@4weblab.it",
      "vatID": "05765760284",
      "foundingDate": "2026",
      "priceRange": "199 - 1299+",
      "founder": {
        "@type": "Person",
        "name": "Carlo Fullin",
        "sameAs": "https://www.linkedin.com/in/carlo-fullin-6aa6b73b7/"
      },
      "areaServed": [
        { "@type": "AdministrativeArea", "name": "Veneto" },
        { "@type": "City", "name": "Padova" },
        { "@type": "City", "name": "Venezia" }
      ],
      "openingHoursSpecification": [{
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        "opens": "09:00",
        "closes": "19:00"
      }],
      "knowsAbout": [
        "Servizio di marketing su Internet",
        "Realizzazione siti web",
        "Search Engine Optimization",
        "Answer Engine Optimization",
        "Generative Engine Optimization",
        "GDPR",
        "Core Web Vitals",
        "Google Ads",
        "SEO locale Veneto",
        "Siti web per imprese edili",
        "Restyling siti web"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Servizi 4 Web Lab",
        "itemListElement": [
          {
            "@type": "Offer",
            "name": "Realizzazione siti web professionali a Padova",
            "priceSpecification": {
              "@type": "PriceSpecification",
              "minPrice": "199",
              "maxPrice": "899",
              "priceCurrency": "EUR"
            },
            "description": "Sviluppo siti web su misura per negozi, aziende e professionisti a Padova e provincia."
          }
        ]
      },
      "sameAs": [
        "https://share.google/fYQnR3BJIrKSNlkDK",
        "https://www.linkedin.com/in/carlo-fullin-6aa6b73b7/"
      ]
    }
    </script>

    <!-- Sitewide JSON-LD: WebSite (entity anchor for per-page WebPage references) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://4weblab.it/#website",
      "url": "https://4weblab.it",
      "name": "4 Web Lab",
      "inLanguage": "it-IT",
      "publisher": { "@id": "https://4weblab.it/#business" }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
